[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rise-ro-crate-profile"
version = "1.0.0"
description = "Pydantic models of the RISE RO-Crate profile"
license = {text = "MIT"}
requires-python = ">= 3.9"
dependencies = ["pydantic >= 2"]

[tool.setuptools]
package-dir = {"" = "generated_profile"}
py-modules = ["rise_ro_crate_profile_pydantic"]
